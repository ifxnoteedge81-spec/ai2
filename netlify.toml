# Netlify is used ONLY as a static download site. The APK is built by GitHub Actions and
# deployed with the Netlify CLI (see .github/workflows/android-build.yml). No server code.
[build]
  publish = "site"

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"PersonalAIComputer.apk\""
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/downloads/version.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
