name: Universal Smart Build & Auto-Heal

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  detect-and-build:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project stack
        id: detect
        run: |
          STACK="unknown"
          if [ -f "package.json" ]; then
            STACK="node"
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            STACK="python"
          elif [ -f "gradlew" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            STACK="android"
          elif [ -f "pubspec.yaml" ]; then
            STACK="flutter"
          fi
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
          echo "Detected stack: $STACK"

      # ---------------- NODE.JS ----------------
      - name: Setup Node.js
        if: steps.detect.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build & Self-Heal Node.js
        if: steps.detect.outputs.stack == 'node'
        run: |
          set -e
          npm ci --no-audit --no-fund || (
            echo "npm ci failed, cleaning lock/cache and retrying with npm install..."
            rm -rf node_modules package-lock.json
            npm cache clean --force || true
            npm install --legacy-peer-deps --no-audit --no-fund
          )
          if npm run | grep -q " build"; then
            npm run build || (
              echo "Build failed once, clearing dist/build cache and retrying..."
              rm -rf dist build .next out
              npm run build
            )
          else
            echo "No build script found in package.json; running syntax check if available."
          fi

      # ---------------- PYTHON ----------------
      - name: Setup Python
        if: steps.detect.outputs.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build & Self-Heal Python
        if: steps.detect.outputs.stack == 'python'
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt || (
              echo "Strict requirements failed, attempting relaxed install..."
              pip install --no-deps -r requirements.txt || true
            )
          elif [ -f "pyproject.toml" ]; then
            pip install . || pip install -e . --no-build-isolation
          fi
          python -m compileall -q .

      # ---------------- ANDROID / GRADLE ----------------
      - name: Setup JDK
        if: steps.detect.outputs.stack == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build & Self-Heal Android
        if: steps.detect.outputs.stack == 'android'
        run: |
          set -e
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || (
            echo "Gradle build failed, cleaning build cache and retrying..."
            ./gradlew clean assembleDebug --refresh-dependencies --no-daemon
          )

      # ---------------- FLUTTER ----------------
      - name: Setup Flutter
        if: steps.detect.outputs.stack == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build & Self-Heal Flutter
        if: steps.detect.outputs.stack == 'flutter'
        run: |
          set -e
          flutter pub get || (flutter clean && flutter pub get)
          flutter analyze || true
          flutter build apk --debug || flutter build web

      # ---------------- FALLBACK / DIAGNOSTICS ----------------
      - name: Fallback & Error Summary
        if: always()
        run: |
          echo "Stack detected: ${{ steps.detect.outputs.stack }}"
          if [ "${{ steps.detect.outputs.stack }}" == "unknown" ]; then
            echo "No standard project manifest (package.json, requirements.txt, gradlew, pubspec.yaml) found at root."
            ls -la
          fi
